<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/inter/wght.css">
<link rel="stylesheet" href="fonts/instrument-serif/400-italic.css">
<style>
  *, *::before, *::after { box-sizing: border-box; transition: none !important; animation: none !important; }
  html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #F4F2ED; }
  body { font-family: 'Inter Variable', system-ui, sans-serif; color: #111; -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .shade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 50; }

  /* device frames */
  .browser { position: absolute; border-radius: 18px; background: #fff; overflow: hidden;
    box-shadow: 0 2px 0 rgba(0,0,0,.04), 0 40px 90px -20px rgba(20,20,40,.35), 0 0 0 1px rgba(0,0,0,.06); }
  .browser .bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: #F7F7F5; border-bottom: 1px solid #E6E4DF; }
  .browser .bar i { width: 12px; height: 12px; border-radius: 99px; background: #DAD7D0; }
  .browser .bar i:nth-child(1) { background: #FF5F57; } .browser .bar i:nth-child(2) { background: #FEBC2E; } .browser .bar i:nth-child(3) { background: #28C840; }
  .browser .url { margin-left: 18px; flex: 1; max-width: 460px; height: 28px; border-radius: 8px; background: #EDEBE6; font-size: 14px; color: #555; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .browser .url::before { content: ''; width: 9px; height: 11px; border: 2px solid #888; border-radius: 2px; border-top-width: 5px; }
  .browser .view { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; background: #fff; }
  .browser .view img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .phone { position: absolute; border-radius: 54px; background: #0B0B0C; padding: 13px;
    box-shadow: 0 50px 90px -24px rgba(20,20,40,.45), inset 0 0 0 2px #2A2A2D; }
  .phone .view { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #fff; }
  .phone .view img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .phone .view::after { content: ''; position: absolute; top: 10px; left: 50%; width: 96px; height: 28px; margin-left: -48px; border-radius: 20px; background: #0B0B0C; }

  /* company scenes */
  .copy { position: absolute; left: 110px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 500; color: #555; }
  .eyebrow b { width: 12px; height: 12px; border-radius: 99px; background: var(--brand); }
  .name { font-size: 92px; font-weight: 750; letter-spacing: -0.045em; line-height: 0.95; margin: 0; }
  .tag { font-size: 52px; line-height: 1.05; margin: 0; color: #222; }
  .role { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; background: #fff; font-size: 20px; font-weight: 550;
    box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 10px 30px -12px rgba(0,0,0,.25); }
  .role::before { content: ''; width: 9px; height: 9px; border-radius: 99px; background: var(--brand); }
  .when { font-size: 18px; color: #666; font-weight: 500; }

  /* hook */
  #hook .copy { width: 900px; }
  #hook h1 { margin: 0; font-size: 132px; line-height: 0.98; font-weight: 750; letter-spacing: -0.05em; }
  #hook h1 .serif { font-size: 1.08em; font-weight: 400; letter-spacing: -0.02em; }
  .line { display: block; overflow: hidden; padding-bottom: 0.08em; }
  .line > span { display: inline-block; }
  .mini { width: 640px; height: 420px; }

  /* own builds */
  #own .head { position: absolute; left: 120px; top: 92px; font-size: 64px; font-weight: 750; letter-spacing: -0.04em; margin: 0; }
  #own .head .serif { font-weight: 400; font-size: 1.1em; }
  .cap { position: absolute; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .cap span { display: block; font-weight: 450; color: #666; font-size: 17px; margin-top: 4px; }

  /* outro */
  #outro { background: #111; color: #F4F2ED; }
  #outro .mosaic { position: absolute; inset: -200px; display: grid; grid-template-columns: repeat(5, 520px); gap: 28px; transform: rotate(-8deg); opacity: .16; }
  #outro .mosaic img { width: 520px; height: 330px; object-fit: cover; object-position: top; border-radius: 14px; }
  #outro .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  #outro h2 { margin: 0; font-size: 230px; font-weight: 800; letter-spacing: -0.06em; line-height: 0.9; }
  #outro .sub { font-size: 60px; color: #E8E4DA; }
  #outro .pill { margin-top: 26px; padding: 18px 34px; border-radius: 999px; background: #F4F2ED; color: #111; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; }
  #outro .small { font-size: 20px; color: #A8A49B; font-weight: 500; letter-spacing: .02em; }
</style>
</head>
<body>

<!-- HOOK -->
<section class="scene" id="hook" style="background:#F4F2ED">
  <div class="copy">
    <div class="eyebrow" style="--brand:#111" data-in><b></b>Jay · Software &amp; applied AI engineer</div>
    <h1><span class="line"><span>In production,</span></span><span class="line"><span class="serif">not in a demo.</span></span></h1>
  </div>
  <div class="browser mini" data-fan style="left:1080px;top:150px"><div class="bar"><i></i><i></i><i></i></div><div class="view"><img src="img/trygrupp-d.jpg"></div></div>
  <div class="browser mini" data-fan style="left:1180px;top:250px"><div class="bar"><i></i><i></i><i></i></div><div class="view"><img src="img/worksage-d.jpg"></div></div>
  <div class="browser mini" data-fan style="left:1080px;top:380px"><div class="bar"><i></i><i></i><i></i></div><div class="view"><img src="img/throughline-d.jpg"></div></div>
  <div class="browser mini" data-fan style="left:1180px;top:500px"><div class="bar"><i></i><i></i><i></i></div><div class="view"><img src="img/theshippack-d.jpg"></div></div>
</section>

<!-- COMPANY SCENES (filled from data below) -->
<template id="company">
  <section class="scene">
    <div class="copy">
      <div class="eyebrow" data-in><b></b><span data-k="num"></span></div>
      <h2 class="name" data-in data-k="name"></h2>
      <p class="tag serif" data-in data-k="tag"></p>
      <div class="role" data-in data-k="role"></div>
      <div class="when" data-in data-k="when"></div>
    </div>
    <div class="browser" data-dev style="left:700px;top:170px;width:1120px;height:700px">
      <div class="bar"><i></i><i></i><i></i><div class="url" data-k="url"></div></div>
      <div class="view"><img data-k="desk" data-scroll></div>
    </div>
    <div class="phone" data-dev style="left:1560px;top:430px;width:290px;height:600px">
      <div class="view"><img data-k="phone" data-scroll></div>
    </div>
  </section>
</template>

<!-- OWN BUILDS -->
<section class="scene" id="own" style="background:#FFF3E2">
  <h2 class="head" data-in>And my own <span class="serif">builds.</span></h2>
  <div class="browser" data-dev style="left:120px;top:250px;width:1000px;height:600px">
    <div class="bar"><i></i><i></i><i></i><div class="url">reelstack</div></div>
    <div class="view" data-cycle="0">
      <img src="img/dashboard.jpg" style="height:100%;object-fit:cover;object-position:top">
      <img src="img/search.jpg" style="height:100%;object-fit:cover;object-position:top">
      <img src="img/home.jpg" style="height:100%;object-fit:cover;object-position:top">
    </div>
  </div>
  <div class="cap" style="left:120px;top:884px" data-in>Reelstack<span>Social watchlist + Riley, an AI agent</span></div>
  <div class="phone" data-dev style="left:1210px;top:220px;width:280px;height:600px">
    <div class="view" data-cycle="0.5">
      <img src="img/qraven-screenq1.jpg"><img src="img/qraven-screenq10.jpg"><img src="img/qraven-screenq11.jpg">
    </div>
  </div>
  <div class="cap" style="left:1210px;top:854px" data-in>QRaven<span>Event ticketing, Go backend</span></div>
  <div class="phone" data-dev style="left:1530px;top:220px;width:280px;height:600px">
    <div class="view" data-cycle="0.25">
      <img src="img/zush-screen2.jpg"><img src="img/zush-screen3.jpg"><img src="img/zush-screen5.jpg">
    </div>
  </div>
  <div class="cap" style="left:1530px;top:854px" data-in>Zush<span>AI-assisted video app</span></div>
</section>

<!-- OUTRO -->
<section class="scene" id="outro">
  <div class="mosaic">
    <img src="img/trygrupp-d.jpg"><img src="img/worksage-d.jpg"><img src="img/throughline-d.jpg"><img src="img/theshippack-d.jpg"><img src="img/home.jpg">
    <img src="img/home.jpg"><img src="img/theshippack-d.jpg"><img src="img/trygrupp-d.jpg"><img src="img/search.jpg"><img src="img/worksage-d.jpg">
    <img src="img/throughline-d.jpg"><img src="img/home.jpg"><img src="img/worksage-d.jpg"><img src="img/trygrupp-d.jpg"><img src="img/theshippack-d.jpg">
    <img src="img/search.jpg"><img src="img/throughline-d.jpg"><img src="img/home.jpg"><img src="img/worksage-d.jpg"><img src="img/home.jpg">
  </div>
  <div class="center">
    <h2 data-in>Jay</h2>
    <div class="sub serif" data-in>Software &amp; applied AI engineer.</div>
    <div class="pill" data-in>jayfolio.dev</div>
    <div class="small" data-in>Open for contracts · Open to roles</div>
  </div>
</section>

<div class="shade" id="shade"></div>

<script>
const COMPANIES = [
  { id: "grupp", num: "01 · Fintech", name: "Grupp", tag: "Digital platform for banks.", role: "Software Engineer · banking + BaaS", when: "2026 – present", url: "trygrupp.africa", desk: "img/trygrupp-d.jpg", phone: "img/trygrupp-p.jpg", deskTo: 980, phoneTo: 1008, brand: "#2E9FDB", bg: "#E6F3FA" },
  { id: "worksage", num: "02 · AI SaaS", name: "WorkSage", tag: "One intelligence layer. Everywhere you work.", role: "Forward-Deployed Engineer", when: "via Gearsparks · 2025 – 26", url: "worksage.ai", desk: "img/worksage-d.jpg", phone: "img/worksage-p.jpg", deskTo: 1030, phoneTo: 550, brand: "#7A2E9E", bg: "#F1E8F5" },
  { id: "throughline", num: "03 · SaaS", name: "Throughline", tag: "Growth shouldn’t need you to be the hero.", role: "Fullstack Engineer · V2 backend", when: "formerly Mission Sync · 2025 – 26", url: "throughline.team", desk: "img/throughline-d.jpg", phone: "img/throughline-p.jpg", deskTo: 1820, phoneTo: 1420, brand: "#E0752F", bg: "#F3F1EC" },
  { id: "shippack", num: "04 · Logistics", name: "ShipPack", tag: "Move anything, anytime across North America.", role: "Software Developer · tracking + pricing", when: "2023 – 24", url: "theshippack.com", desk: "img/theshippack-d.jpg", phone: "img/theshippack-p.jpg", deskTo: 2730, phoneTo: 229, brand: "#3340B0", bg: "#E9EAF7" },
];
const tpl = document.getElementById("company");
const outro = document.getElementById("outro");
for (const c of COMPANIES) {
  const s = tpl.content.firstElementChild.cloneNode(true);
  s.id = c.id; s.style.background = c.bg; s.style.setProperty("--brand", c.brand);
  s.querySelectorAll("[data-k]").forEach((el) => {
    const k = el.dataset.k;
    if (el.tagName === "IMG") el.src = c[k]; else el.textContent = c[k];
  });
  document.body.insertBefore(s, document.getElementById("own"));
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, d) => clamp((t - a) / d);
const expo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, x) => a + (b - a) * x;

// 120 BPM: every boundary is on a beat (0.5 s grid).
const SCENES = [["hook", 0, 3], ["grupp", 3, 6.5], ["worksage", 6.5, 10], ["throughline", 10, 13.5], ["shippack", 13.5, 17], ["own", 17, 21], ["outro", 21, 24]];
const PUSH = 0.55;

function textIn(scene, t, t0, step = 0.09) {
  $$("[data-in]", scene).forEach((el, i) => {
    const k = expo(p(t, t0 + i * step, 0.7));
    el.style.opacity = clamp(k * 1.4);
    el.style.transform = `translateY(${lerp(40, 0, k)}px)`;
  });
}
function scrollImg(img, t, t0, dur, frac, px) {
  const view = img.parentElement;
  const limit = Math.max(0, img.offsetHeight - view.clientHeight);
  const max = px != null ? Math.min(px, limit) : limit * frac;
  img.style.transform = `translateY(${-max * inOut(p(t, t0, dur))}px)`;
}

window.render = function (t) {
  SCENES.forEach(([id, a, b], i) => {
    const el = document.getElementById(id);
    const next = SCENES[i + 1];
    const inNow = t >= a && t < b + (next ? PUSH : 1);
    el.style.display = inNow ? "block" : "none";
    el.style.zIndex = i + 1;
    // push in from the right; the outgoing scene drifts left and dims under it
    const kin = i === 0 ? 1 : inOut(p(t, a, PUSH));
    const kout = next ? inOut(p(t, b, PUSH)) : 0;
    el.style.transform = `translateX(${lerp(100, 0, kin) - 22 * kout}%) scale(${1 - 0.04 * kout})`;
    el.style.filter = kout > 0 ? `brightness(${1 - 0.35 * kout})` : "";
  });

  // hook
  const hook = $("#hook");
  $$(".line > span", hook).forEach((s, i) => {
    const k = expo(p(t, 0.15 + i * 0.5, 0.9));
    s.style.transform = `translateY(${lerp(110, 0, k)}%)`;
  });
  textIn(hook, t, 0.05);
  $$("[data-fan]", hook).forEach((el, i) => {
    const t0 = 0.25 + i * 0.5;
    const k = expo(p(t, t0, 0.8));
    const rot = [-7, 4, -3, 6][i];
    el.style.opacity = clamp(k * 2);
    el.style.transform = `translate(${lerp(500, 0, k)}px, ${lerp(80, 0, k)}px) rotate(${lerp(rot * 2.2, rot, k)}deg)`;
    scrollImg($("img", el), t, t0 + 0.4, 2.4, 0.12);
  });

  // companies
  for (const c of COMPANIES) {
    const [, a] = SCENES.find((s) => s[0] === c.id);
    const s = document.getElementById(c.id);
    textIn(s, t, a + 0.25);
    const [br, ph] = $$("[data-dev]", s);
    const kb = expo(p(t, a + 0.2, 1.0)), kp = expo(p(t, a + 0.45, 1.0));
    br.style.transform = `translateY(${lerp(140, 0, kb)}px) rotate(${lerp(2.5, 0, kb)}deg)`;
    ph.style.transform = `translateY(${lerp(260, 0, kp)}px) rotate(${lerp(-6, 0, kp)}deg)`;
    scrollImg($("img", br), t, a + 0.9, 2.6, 0, c.deskTo);
    scrollImg($("img", ph), t, a + 1.0, 2.5, 0, c.phoneTo);
  }

  // own builds: screens swap on the beat
  const own = $("#own");
  textIn(own, t, 17.25, 0.12);
  $$("[data-dev]", own).forEach((el, i) => {
    const k = expo(p(t, 17.3 + i * 0.25, 0.9));
    el.style.transform = `translateY(${lerp(200, 0, k)}px)`;
  });
  $$("[data-cycle]", own).forEach((v) => {
    const off = Number(v.dataset.cycle);
    const imgs = $$("img", v);
    const idx = clamp(Math.floor((t - 17.75 - off) / 1.0), 0, imgs.length - 1);
    imgs.forEach((im, j) => (im.style.display = j === idx ? "block" : "none"));
  });

  // outro
  const o = $("#outro");
  textIn(o, t, 21.2, 0.14);
  $(".mosaic", o).style.transform = `rotate(-8deg) translate(${lerp(0, -160, p(t, 21, 3))}px, ${lerp(0, -60, p(t, 21, 3))}px)`;
};

window.ready = Promise.all([
  document.fonts.load("750 40px 'Inter Variable'", "AZaz"), document.fonts.load("400 16px 'Inter Variable'", "AZaz"),
  document.fonts.load("italic 400 40px 'Instrument Serif'", "AZaz"),
  ...Array.from(document.images).map((im) => im.decode().catch(() => {})),
]).then(() => document.fonts.ready).then(() => { render(0); return true; });
</script>
</body>
</html>
